---
- name: Set timezone
  community.general.timezone:
    name: "{{ pi_timezone }}"
  tags: [configuration]

- name: Ensure locale is generated
  community.general.locale_gen:
    name: "{{ pi_locale }}"
    state: present
  tags: [configuration]

- name: Expand root filesystem
  ansible.builtin.command:
    cmd: raspi-config --expand-rootfs
  register: expand_result
  changed_when: "'fixed' in expand_result.stdout"
  notify: Reboot Raspberry Pi
  tags: [configuration]

- name: Check if cgroups are already enabled
  ansible.builtin.command: grep -q 'cgroup_enable=memory' /boot/firmware/cmdline.txt
  register: cgroup_check
  failed_when: false
  changed_when: false
  tags: [k3s]

- name: Enable cgroups in cmdline.txt for k3s compatibility
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '^(.*)'
    replace: '\1 cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1'
  when: cgroup_check.rc != 0
  notify: Reboot Raspberry Pi
  tags: [k3s]
