---
- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: '0755'
  tags: [rancher]

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get_helm.sh
    creates: /usr/local/bin/helm
  tags: [rancher]

- name: Add Rancher Helm repo
  kubernetes.core.helm_repository:
    name: rancher-stable
    repo_url: https://releases.rancher.com/server-charts/stable
  environment:
    KUBECONFIG: "{{ rancher_kubeconfig }}"
  tags: [rancher]

- name: Install or upgrade Rancher
  kubernetes.core.helm:
    name: rancher
    chart_ref: rancher-stable/rancher
    release_namespace: cattle-system
    create_namespace: true
    chart_version: "{{ rancher_version }}"
    values:
      hostname: "{{ rancher_hostname }}"
      bootstrapPassword: "{{ rancher_bootstrap_password }}"
      replicas: 1
      ingress:
        ingressClassName: "{{ rancher_ingress_class }}"
        tls:
          source: secret
          secretName: "{{ rancher_tls_secret_name }}"
    wait: true
    wait_timeout: "10m"
  environment:
    KUBECONFIG: "{{ rancher_kubeconfig }}"
  tags: [rancher]

- name: Wait for Rancher rollout
  ansible.builtin.command:
    cmd: kubectl rollout status deploy/rancher -n cattle-system --timeout=10m
  environment:
    KUBECONFIG: "{{ rancher_kubeconfig }}"
  changed_when: false
  tags: [rancher]
