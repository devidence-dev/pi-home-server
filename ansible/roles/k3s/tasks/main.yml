---
- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'
  tags: [k3s]

- name: Install k3s
  ansible.builtin.command:
    cmd: /tmp/k3s_install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_EXEC: "{{ k3s_exec_args }}"
  notify: Restart k3s
  tags: [k3s]

- name: Wait for k3s kubeconfig to be available
  ansible.builtin.wait_for:
    path: "{{ k3s_kubeconfig }}"
    state: present
    timeout: 120
  tags: [k3s]

- name: Set kubeconfig permissions
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig }}"
    mode: '0644'
  tags: [k3s, configuration]

- name: Ensure .kube directory exists for user
  ansible.builtin.file:
    path: "/home/{{ setup_user }}/.kube"
    state: directory
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: '0755'
  tags: [k3s, configuration]

- name: Copy kubeconfig to user home
  ansible.builtin.copy:
    src: "{{ k3s_kubeconfig }}"
    dest: "/home/{{ setup_user }}/.kube/config"
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
    mode: '0600'
    remote_src: true
  tags: [k3s, configuration]
